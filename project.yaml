project:
  name: "textus-bok"
  title: "Textus BoK"
  kind: car
  organization: "org.textus"
  scalaPackage: "org.simplemodeling.textus.bok"
  component:
    name: "textus-bok"
    className: "Bok"
    displayName: "Textus BoK"
    version: "0.1.0-SNAPSHOT"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.0-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.1-SNAPSHOT"
      - "org.textus::textus-semantic-integration-engine:0.2.0-SNAPSHOT"
    test:
      - "org.scalatest::scalatest:3.2.19"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    abi:
      dependencies:
        - name: "textus-semantic-integration-engine"
          abiRange: "[0.2.0,0.3.0)"
    manifest_metadata:
      boundedContext: "body-of-knowledge"
      domain: "bok"
    runtime:
      cncf:
        minimum: "0.5.1-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.1-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-bok"
