subsystem: textus-bok-codex
version: 0.1.0-SNAPSHOT
components:
  - namespace: org.simplemodeling.textus
    id: SemanticIntegrationEngine
    version: 0.2.0-SNAPSHOT
  - namespace: org.simplemodeling.textus
    id: Bok
    version: 0.1.0-SNAPSHOT
  - namespace: org.simplemodeling.textus
    id: Scraper
    version: 0.1.1-SNAPSHOT
config:
  textus.subsystem.user-mode: standalone
  textus.bok.profile-registry:
    profiles:
      - profile: official
        source:
          sourceId: urn:textus:bok:packaged-demo
          datasetId: urn:textus:bok:packaged-demo
          generation: packaged-car-sar-v1
          resource: file:///workspace/bok-fixture/
        evidence:
          uri: urn:textus:bok:packaged-demo:evidence:packaged-car-sar-v1
          sourceId: urn:textus:bok:packaged-demo
security:
  authentication:
    convention: disabled
    fallback_privilege: disabled
    local_subject:
      id: textus-bok-codex-local-user
      roles:
        - user
      capabilities:
        - user
      security_level: user
      attributes:
        installation: bok-codex-sar
