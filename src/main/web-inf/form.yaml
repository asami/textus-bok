expose:
  bok.bok-retrieval.get-knowledge-map: public
  bok.bok-retrieval.replace-knowledge-source: protected
  bok.bok-retrieval.search-terms: public
form:
  bok.bok-retrieval.get-knowledge-map:
    enabled: true
    stayOnError: true
  bok.bok-retrieval.replace-knowledge-source:
    enabled: true
    successRedirect: /web/${component}/admin/entities/bok-term/${result.id}
    stayOnError: true
    controls:
      description:
        type: textarea
  bok.bok-retrieval.search-terms:
    enabled: true
    successRedirect: /web/${component}/admin/entities/bok-term
    stayOnError: true
admin:
  entity.bok-term:
    totalCount: optional
